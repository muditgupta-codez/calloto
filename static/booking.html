<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Time — Calloto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/frontend.css?v=3">
</head>
<body>
    <div class="booking-page">
        <div class="booking-container">
            <a href="/" class="logo logo-dark" style="justify-content:center;margin-bottom:32px">
                <span class="logo-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                </span>
                Calloto<span class="logo-dot">.</span>
            </a>
            <div class="form-card">
                <h1>Book a time</h1>
                <p class="form-sub" id="business-name">Select a time that works for you</p>
                <form id="booking-form">
                    <div class="fg">
                        <label class="form-label" for="name">Your name</label>
                        <input class="form-input" type="text" id="name" name="name" placeholder="John Smith" required>
                    </div>
                    <div class="fg">
                        <label class="form-label" for="phone">Your phone number</label>
                        <input class="form-input" type="tel" id="phone" name="phone" placeholder="+44 7..." required>
                    </div>
                    <div class="fg">
                        <label class="form-label" for="date">Preferred date</label>
                        <input class="form-input" type="date" id="date" name="date" required>
                    </div>
                    <div class="fg">
                        <label class="form-label" for="time">Preferred time</label>
                        <select class="form-select" id="time" name="time" required>
                            <option value="">Select a time</option>
                            <option value="09:00">9:00 AM</option>
                            <option value="10:00">10:00 AM</option>
                            <option value="11:00">11:00 AM</option>
                            <option value="12:00">12:00 PM</option>
                            <option value="13:00">1:00 PM</option>
                            <option value="14:00">2:00 PM</option>
                            <option value="15:00">3:00 PM</option>
                            <option value="16:00">4:00 PM</option>
                            <option value="17:00">5:00 PM</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-green btn-block btn-lg" id="submit-btn">
                        Confirm booking
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </button>
                    <div class="form-error" id="error-msg"></div>
                </form>
                <div class="success-state" id="success-msg" style="display:none">
                    <div class="success-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    </div>
                    <h1>Booking confirmed!</h1>
                    <p class="form-sub">We'll send you a confirmation shortly.</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const customerId = params.get('customer_id');
        const businessName = params.get('name');
        if (businessName) document.getElementById('business-name').textContent = `Book with ${businessName}`;
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').min = today;

        document.getElementById('booking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errorEl = document.getElementById('error-msg');
            btn.disabled = true;
            btn.innerHTML = '<span>Booking...</span>';
            errorEl.style.display = 'none';
            const data = {
                customer_id: customerId,
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
            };
            try {
                const res = await fetch('/api/bookings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });
                if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Booking failed'); }
                document.getElementById('booking-form').style.display = 'none';
                document.getElementById('success-msg').style.display = 'block';
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'flex';
                btn.disabled = false;
                btn.innerHTML = 'Confirm booking <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
            }
        });
    </script>
</body>
</html>
